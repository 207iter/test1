<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행운의 로또 번호 추천기</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
            --card-bg: rgba(30, 30, 45, 0.7);
            --text-color: #ffffff;
            --subtitle-color: #a0a0c0;
            --card-border: rgba(255, 255, 255, 0.1);
            --btn-gradient: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            --history-item-bg: rgba(255, 255, 255, 0.03);
            --history-item-color: #d0d0e0;
            --toggle-bg: rgba(255, 255, 255, 0.1);
            --toggle-color: #ffffff;
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #2c3e50;
            --subtitle-color: #555555;
            --card-border: rgba(0, 0, 0, 0.1);
            --btn-gradient: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            --history-item-bg: rgba(0, 0, 0, 0.04);
            --history-item-color: #2c3e50;
            --toggle-bg: rgba(0, 0, 0, 0.08);
            --toggle-color: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }
        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--toggle-bg);
            color: var(--toggle-color);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .theme-toggle:hover {
            transform: scale(1.05);
        }
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff8e53, #ff6b6b, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: var(--subtitle-color);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .balls-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 35px;
            min-height: 60px;
            align-items: center;
        }
        .ball {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: inset -3px -3px 8px rgba(0,0,0,0.4), 0 4px 10px rgba(0,0,0,0.3);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        /* Lotto ball colors based on number ranges */
        .ball-yellow { background: linear-gradient(135deg, #f1c40f, #f39c12); color: #333; }
        .ball-blue { background: linear-gradient(135deg, #3498db, #2980b9); }
        .ball-red { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .ball-gray { background: linear-gradient(135deg, #95a5a6, #7f8c8d); }
        .ball-green { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .placeholder {
            color: var(--subtitle-color);
            font-style: italic;
            font-size: 1rem;
        }
        button.generate-btn {
            background: var(--btn-gradient);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            margin-bottom: 25px;
        }
        button.generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.6);
        }
        button.generate-btn:active {
            transform: translateY(1px);
        }
        .history-section {
            text-align: left;
            border-top: 1px solid var(--card-border);
            padding-top: 20px;
        }
        .history-title {
            font-size: 0.9rem;
            color: var(--subtitle-color);
            margin-bottom: 10px;
        }
        .history-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .history-item {
            background: var(--history-item-bg);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--history-item-color);
        }
        .history-numbers {
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body data-theme="dark">
    <div class="top-nav" style="position: absolute; top: 20px; right: 20px; display: flex; gap: 10px;">
        <a href="contact.html" class="nav-btn" style="background: var(--toggle-bg); color: var(--toggle-color); border: 1px solid var(--card-border); border-radius: 30px; padding: 8px 16px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-decoration: none;">🤝 제휴 문의</a>
        <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" style="position: static;">
            <span id="themeIcon">☀️</span> <span id="themeText">라이트모드</span>
        </button>
    </div>

    <div class="container">
        <h1>🍀 행운의 로또 번호</h1>
        <p class="subtitle">오늘의 대박 행운을 잡으세요!</p>
        
        <div class="balls-container" id="ballsContainer">
            <span class="placeholder">아래 버튼을 눌러 번호를 생성하세요!</span>
        </div>
        
        <button class="generate-btn" onclick="generateLottoNumbers()">번호 추천 받기</button>
        
        <div class="history-section">
            <div class="history-title">최근 추천 기록</div>
            <div class="history-list" id="historyList">
                <div class="placeholder" style="font-size:0.85rem; text-align:center;">기록이 없습니다.</div>
            </div>
        </div>
    </div>

    <script>
        // Theme initialization
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        updateThemeUI(savedTheme);

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (theme === 'light') {
                icon.textContent = '🌙';
                text.textContent = '다크모드';
            } else {
                icon.textContent = '☀️';
                text.textContent = '라이트모드';
            }
        }

        function getBallClass(num) {
            if (num <= 10) return 'ball-yellow';
            if (num <= 20) return 'ball-blue';
            if (num <= 30) return 'ball-red';
            if (num <= 40) return 'ball-gray';
            return 'ball-green';
        }

        function generateLottoNumbers() {
            const numbers = [];
            while (numbers.length < 6) {
                const rand = Math.floor(Math.random() * 45) + 1;
                if (!numbers.includes(rand)) {
                    numbers.push(rand);
                }
            }
            numbers.sort((a, b) => a - b);

            const container = document.getElementById('ballsContainer');
            container.innerHTML = '';

            numbers.forEach((num, index) => {
                const ball = document.createElement('div');
                ball.className = `ball ${getBallClass(num)}`;
                ball.textContent = num;
                ball.style.animationDelay = `${index * 0.1}s`;
                container.appendChild(ball);
            });

            addHistory(numbers);
        }

        function addHistory(numbers) {
            const historyList = document.getElementById('historyList');
            if (historyList.querySelector('.placeholder')) {
                historyList.innerHTML = '';
            }

            const item = document.createElement('div');
            item.className = 'history-item';
            
            const now = new Date();
            const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            
            item.innerHTML = `
                <span class="history-numbers">${numbers.join(', ')}</span>
                <span style="color: var(--subtitle-color); font-size: 0.75rem;">${timeString}</span>
            `;

            historyList.prepend(item);

            if (historyList.children.length > 5) {
                historyList.removeChild(historyList.lastChild);
            }
        }
    </script>
</body>
</html>
